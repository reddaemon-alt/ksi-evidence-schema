name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python validate.py
      - run: python validate.py --checks
      - run: python collector.py checks/ksi-iam-apm.yaml
      - run: python tools/sync_ksi.py --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
